[proxy]
; local proxy port — point your torrent client here
listen_port               = 3456
; unused — reserved; mitmproxy handles tracker connection timeouts itself
tracker_timeout           = 5

[spoofing]
; unused — reserved; ratio_based is the only engine mode
upload_mode               = ratio_based
; target upload/download ratio
target_ratio              = 1.60
; internal target = target_ratio + buffer
target_ratio_buffer       = 0.03
; legacy master switch for announce de-correlation; see [anti_detection]
anti_clustering           = true
; hard cap per torrent
max_ratio_per_torrent     = 3.0
; hard cap across all torrents for one tracker domain
max_global_ratio_per_tracker = 2.5
; aggressiveness of catch-up toward target (0.0–1.0)
catch_up_factor           = 0.22
; MB credited per announce for pure seeders (no DL history)
seed_credit_mb            = 5.0
; target total UL for pure seeders (used for progress bar)
seed_target_mb            = 500.0
; unused — reserved
seeding_dl_ratio          = 0.85
; maximum simulated upload speed in MB/s
max_simulated_speed_mbps  = 10.0
; percentage noise applied to each upload increment
upload_noise_pct          = 3.0
; probability of deliberate stagnation per announce
stagnation_probability    = 0.03
; stop injection cleanly when target_ratio is reached
auto_stop_at_target       = true

[anti_detection]
; random: use the User-Agent paired with the session peer_id (recommended)
; fixed:  force user_agent_value — this breaks the peer_id/User-Agent pairing
;         that real clients always respect, and trackers can cross-check it
user_agent_mode           = random
; used only when user_agent_mode = fixed
user_agent_value          = qBittorrent/5.1.0
; send the emulated client's User-Agent; false leaves your client's own header
spoof_user_agent          = true
; use one peer_id and one key for the whole session, like a real client
spoof_peer_id             = true
; send the numwant value of the emulated client instead of the real one
spoof_peers               = true
; unused — reserved
peer_variance             = 0.15
; assign a stable spoofed port for the whole session
spoof_port                = true
; range to pick the spoofed port from
port_range                = 6881-6999
; inject realistic Accept / Accept-Language headers
spoof_headers             = true
; silently drop scrape requests; a client that never scrapes is atypical, keep false
intercept_scrape          = false
; send back the trackerid a tracker hands out, as BEP 3 asks every client to do
echo_trackerid            = true
; comma-separated domains; empty = allow all
tracker_whitelist         =
; comma-separated domains to ignore
tracker_blacklist         =
; give every torrent its own announce period so torrents sharing a tracker
; never stay in lockstep; the interval is only ever pushed later, never earlier
desync_announces          = true
; maximum extra delay added to the tracker interval, as a fraction (0.0-0.45)
desync_spread_pct         = 0.18
; two announces to the same tracker closer than this count as a cluster and
; widen the spread of the torrents involved
desync_min_gap            = 45
; reproduce the grouped announce burst a real client produces when it starts:
; upload ramps up instead of running at full speed from the first announce
startup_burst             = true
; length of that startup window, in seconds
startup_burst_window      = 300
; upload multiplier at the very beginning of the window (0.0-1.0)
startup_ramp_floor        = 0.15

[ssl]
; unused — reserved; certificate handling is left to mitmproxy's own settings
ssl_verify_trackers       = true

[stats]
; save stats.json on each announce batch
persist_stats             = true
; remove torrent from stats on event=stopped
auto_purge_stopped        = true
; seconds to wait after event=stopped before the torrent is really dropped; a
; client that stops and comes back inside that window keeps its counters, and a
; whole shutdown burst costs one save instead of one per torrent. 0 = immediate
stopped_purge_delay       = 120
; days before an inactive tracker domain is dropped from _tracker_cumul
tracker_cumul_ttl_days    = 30

[web]
; enable the FastAPI web UI
web_enabled               = true
; bind address for the web UI
web_host                  = 0.0.0.0
; port for the web UI
web_port                  = 8080
; secret token required to access the UI/API; empty = no authentication
web_secret_token          =
; obfuscation path prefix, e.g. myS3cretPath; empty = served at root
web_path_prefix           =
; max /api/ and /metrics requests per minute per client IP; 0 = unlimited
; pages and static assets are never rate limited
web_rate_limit            = 240

[advanced]
; minimum seconds between announces for the same torrent
min_announce_interval     = 1800
; DEBUG | INFO | WARNING | ERROR
log_level                 = INFO
; unused — reserved
multi_tracker_delay_min   = 0.5
; unused — reserved
multi_tracker_delay_max   = 8.0
; unused — reserved; a fake event=started contradicts a growing upload counter
event_anomaly_probability = 0.03
; probability of adding a corrupt= field
corrupt_field_probability = 0.05
; consecutive zero-DL announces before STALL_NET flag
stall_announce_threshold  = 8
; minimum announces before stagnation can trigger
min_announces_before_stagnation = 10
; ±jitter applied to the announce interval (fraction)
interval_jitter_pct       = 0.08
; active injection window; e.g. 8-22 limits to daytime
inject_hours              = 0-23
; follow the announce interval returned by the tracker when available
respect_tracker_interval  = true
; folder scanned for new .torrent files; empty = disabled
watch_folder              = torrents

[client]
; emulated client profile: qbittorrent | transmission | deluge | libtorrent | rtorrent | random
; each profile pairs every peer_id prefix with the User-Agent of that exact version
client_profile            = random
; rotate the profile on each service restart (a real client keeps its identity per session)
; legacy switch, still read when session_identity is left empty
rotate_profile_on_restart = true
; what carries over from one session to the next:
;   stable  same profile, same peer_id, same port, for ever
;   drift   same profile and port, fresh peer_id tail each start, and now and then
;           a move up to the next release of that same client (recommended)
;   rotate  a brand new client every start
session_identity          = drift
; chance, per start in drift mode, of reporting the next release of the same
; client - what a real install does when it gets updated
version_bump_probability  = 0.10

[bandwidth]
; global upload ceiling in MB/s shared by every torrent; 0 = unlimited
global_max_speed_mbps     = 8.0
; hard ceiling for the implicit speed of a single announce, in MB/s
per_torrent_speed_cap_mbps = 12.0
; ceiling for how fast the reported download may grow, in MB/s; this is what
; keeps left from collapsing in one step when a seeder adopts its full size.
; 0 = no limit
max_download_speed_mbps   = 12.0
; smooth the active window instead of an on/off switch at inject_hours boundaries
circadian_smoothing       = true
; upload multiplier applied during the quietest hour (0.0-1.0)
circadian_night_factor    = 0.35

[notifications]
; generic | discord | slack ; empty url disables notifications
webhook_url               =
webhook_format            = generic
; comma-separated events: target_reached, tracker_down, tracker_up, global_cap, purged
webhook_events            = target_reached,tracker_down,global_cap

[upstream]
; forward tracker announces through an external proxy, e.g. http://gluetun:8888
proxy_url                 =
; comma-separated domains that must bypass the upstream proxy
proxy_bypass              =

[simulation]
; compute and log everything without modifying any announce
dry_run                   = false
