services:
  newgreedy:
    image: ghcr.io/mrt0t0/newgreedy:latest
    build: .
    container_name: newgreedy
    restart: unless-stopped
    ports:
      # proxy: this host only - containers on the same network use newgreedy:3456
      - "127.0.0.1:3456:3456"
      # web UI: a token is generated at the first start (docker compose logs newgreedy)
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - mitmproxy_ca:/home/newgreedy/.mitmproxy

volumes:
  mitmproxy_ca:
