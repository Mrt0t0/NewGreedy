<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NewGreedy — Torrents</title>
<link rel="stylesheet" href="/static/style.css?v=1.7.7">
<style>
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--tx)}
th.sortable::after{content:'';margin-left:4px;opacity:.4}
th.sortable.asc::after{content:'\2191';opacity:1}
th.sortable.desc::after{content:'\2193';opacity:1}
.tagchip{display:inline-block;font-size:9px;padding:1px 5px;border-radius:10px;background:var(--bg3);border:1px solid var(--bd);color:var(--mu);margin-left:3px}
.act{background:none;border:1px solid var(--bd);color:var(--mu);border-radius:4px;padding:1px 6px;cursor:pointer;font-size:11px;margin-right:3px}
.act:hover{color:var(--tx);border-color:var(--mu)}
</style>
</head>
<body>
<nav>
  <span class="brand">NewGreedy</span>
  <div class="nav-links">
    <a href="/"         data-page="dashboard">Dashboard</a>
    <a href="/torrents" data-page="torrents">Torrents</a>
    <a href="/charts"   data-page="charts">Charts</a>
    <a href="/config"   data-page="config">Config</a>
    <a href="/logs"     data-page="logs">Logs</a>
    <a href="/help"     data-page="help">Help</a>
  </div>
  <div class="nav-right">
    <a id="ubadge" href="#"></a>
    <button id="ttheme">☀️</button>
  </div>
</nav>
<main>

<h1>Torrents</h1>
<div class="sec">
  <div class="sec-t">📤 Upload .torrent — pre-register infohash & size</div>
  <div class="upzone" id="upzone"
       onclick="document.getElementById('fup').click()"
       ondragover="event.preventDefault();this.classList.add('over')"
       ondragleave="this.classList.remove('over')"
       ondrop="event.preventDefault();this.classList.remove('over');handleFiles(event.dataTransfer.files)">
    <div style="font-size:30px">📁</div>
    <div class="up-title">Drag & drop a .torrent here</div>
    <div class="up-sub">or click to browse — multiple files supported</div>
  </div>
  <input type="file" id="fup" accept=".torrent" multiple style="display:none" onchange="handleFiles(this.files)">
  <div class="alert hid" id="upalert"></div>
</div>
<div class="toolbar">
  <button class="btn active" onclick="setF('all',this)">All</button>
  <button class="btn" onclick="setF('seed',this)">Seed</button>
  <button class="btn" onclick="setF('down',this)">Downloading</button>
  <button class="btn" onclick="setF('stall',this)">Stalled</button>
  <button class="btn" onclick="setF('tgt',this)">Target</button>
  <input id="q" placeholder="Search name, hash or tag" oninput="render()"
         style="width:210px;font-family:var(--font);font-size:12px;padding:4px 10px">
  <span class="spacer"></span>
  <button class="btn" onclick="window.open(ngUrl('/api/backup'),'_blank')">💾 Backup</button>
  <button class="btn dan" onclick="purge()">🗑 Purge done</button>
  <button class="btn dan" onclick="purgeInactive()">⏱ Purge inactive 12h</button>
  <button class="btn" onclick="window.open('/api/stats/csv','_blank')">⬇ CSV</button>
  <button class="btn" onclick="load()">⟳ Refresh</button>
</div>
<div class="twrap">
  <table>
    <thead><tr>
      <th class="sortable" onclick="setSort('name')">Torrent</th>
      <th class="sortable" onclick="setSort('mode')">Mode</th>
      <th class="sortable" onclick="setSort('dl')">Real DL</th>
      <th class="sortable" onclick="setSort('rul')">Real UL</th>
      <th class="sortable" onclick="setSort('ul')">Inj. UL</th>
      <th class="sortable" onclick="setSort('ratio')">Ratio</th>
      <th>Progress</th>
      <th>ETA</th>
      <th class="sortable" onclick="setSort('ann')">Ann#</th>
      <th>Trackers</th>
      <th class="sortable" onclick="setSort('seen')">Last seen</th>
      <th>Status</th><th>Actions</th>
    </tr></thead>
    <tbody id="tbody"><tr><td colspan="13" style="text-align:center;padding:20px" class="muted">Loading…</td></tr></tbody>
  </table>
</div>
<div class="ts" id="ts" style="margin-top:8px"></div>

</main>
<script src="/static/app.js?v=1.7.7"></script>
<script>
if (typeof ngUrl !== 'function') {
  document.addEventListener('DOMContentLoaded', function () {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#f85149;color:#fff;padding:10px 14px;font:13px -apple-system,sans-serif;text-align:center';
    d.innerHTML = 'static/app.js failed to load or is outdated. Force-reload the page (Ctrl+Shift+R / Cmd+Shift+R) or check that static/app.js is present on the server.';
    document.body.insertBefore(d, document.body.firstChild);
  });
}
</script>
<script>

// ── helpers ──────────────────────────────────────────────────────────────────


var _data={}, _filter='all', _tgt=1.6;
function setF(f,el){
  _filter=f;
  document.querySelectorAll('.toolbar .btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active'); render();
}
var _sort='seen', _dir=-1;
function setSort(k){
  if(_sort===k){_dir=-_dir;}else{_sort=k;_dir=(k==='name'?1:-1);}
  document.querySelectorAll('th.sortable').forEach(t=>t.classList.remove('asc','desc'));
  var idx={name:0,mode:1,dl:2,rul:3,ul:4,ratio:5,ann:8,seen:10}[k];
  var th=document.querySelectorAll('thead th')[idx];
  if(th) th.classList.add(_dir>0?'asc':'desc');
  render();
}
function sortVal(k,ih,d){
  if(k==='name')  return (d.name||ih).toLowerCase();
  if(k==='mode')  return getMode(d);
  if(k==='dl')    return d.cumul_rep_dl||0;
  if(k==='rul')   return d.cumul_real_ul||0;
  if(k==='ul')    return d.cumul_rep_ul||0;
  if(k==='ratio') return ratioNum(d)||0;
  if(k==='ann')   return d.ann_count||0;
  return d.last_announce_ts||0;
}
function matchQ(ih,d,q){
  if(!q) return true;
  q=q.toLowerCase();
  if(ih.toLowerCase().indexOf(q)>-1) return true;
  if((d.name||'').toLowerCase().indexOf(q)>-1) return true;
  return (d.tags||[]).some(t=>t.toLowerCase().indexOf(q)>-1);
}
function togglePause(ih,cur){
  API.post('/api/control/pause',{hash:ih,paused:!cur}).then(load)
    .catch(e=>alert('Error: '+e.message));
}
function editRatio(ih,d){
  var cur=(d.override&&d.override.target_ratio)||'';
  var v=prompt('Target ratio for '+(d.name||ih)+'\n(empty to clear the override)',cur);
  if(v===null) return;
  var body=v.trim()===''?{hash:ih,clear:true}:{hash:ih,target_ratio:parseFloat(v)};
  if(v.trim()!==''&&isNaN(body.target_ratio)){alert('Not a number');return;}
  API.post('/api/control/override',body).then(load).catch(e=>alert('Error: '+e.message));
}
function editTags(ih,d){
  var v=prompt('Tags for '+(d.name||ih)+' (comma separated)',(d.tags||[]).join(', '));
  if(v===null) return;
  API.post('/api/control/tags',{hash:ih,tags:v}).then(load).catch(e=>alert('Error: '+e.message));
}
function render(){
  var q=(document.getElementById('q')||{}).value||'';
  var rows=Object.entries(_data).filter(([ih,d])=>{
    if(!matchQ(ih,d,q)) return false;
    var m=getMode(d);
    if(_filter==='all')   return true;
    if(_filter==='seed')  return m==='SEED';
    if(_filter==='down')  return m==='DOWN';
    if(_filter==='stall') return m==='STALL';
    if(_filter==='tgt')   return m==='TARGET';
    return true;
  });
  var tb=document.getElementById('tbody');
  if(!rows.length){
    tb.innerHTML='<tr><td colspan="13" style="text-align:center;padding:20px" class="muted">No data</td></tr>';
    return;
  }
  rows.sort((a,b)=>{
    var x=sortVal(_sort,a[0],a[1]), y=sortVal(_sort,b[0],b[1]);
    return x<y?-_dir:x>y?_dir:0;
  });
  tb.innerHTML=rows.map(([ih,d])=>{
    var r=ratioNum(d);
    var eta=d.ann_count>1&&d.cumul_rep_dl>0
      ? Math.round(Math.max(0,d.cumul_rep_dl*_tgt-d.cumul_rep_ul)/(d.cumul_rep_ul/d.ann_count))
      : 0;
    return '<tr>'
      +'<td class="mono"><a href="'+ngUrl('/charts?ih='+ih)+'" title="'+ih+'" style="color:var(--mu)">'+fName(d,ih)+'</a>'+(d.has_udp?' <span class="tag stall" title="This torrent uses UDP trackers which bypass NewGreedy">UDP</span>':'')+(d.override&&d.override.target_ratio?' <span class="tagchip" title="Ratio override">R'+d.override.target_ratio+'</span>':'')+((d.tags||[]).map(t=>' <span class="tagchip">'+t+'</span>').join(''))+'</td>'
      +'<td>'+modeTxt(d)+'</td>'
      +'<td class="mono">'+(d.cumul_rep_dl>0?fB(d.cumul_rep_dl):'<span class="muted">—</span>')+'</td>'
      +'<td class="mono muted">'+fB(d.cumul_real_ul||0)+'</td>'
      +'<td class="mono">'+fB(d.cumul_rep_ul)+'</td>'
      +'<td class="mono">'+(r!=null?fR(r):'<span class="muted">—</span>')+'</td>'
      +'<td>'+rbar(r,_tgt)+'</td>'
      +'<td class="mono muted">'+fE(eta)+'</td>'
      +'<td class="mono muted">'+(d.ann_count||0)+'</td>'
      +'<td class="mono muted">'+trkCell(d)+'</td>'
      +'<td class="mono muted">'+fAge(d.last_announce_ts)+'</td>'
      +'<td>'+stag(d)+'</td>'
      +'</tr>';
  }).join('');
}
function sa(msg,type){
  var a=document.getElementById('upalert');
  a.textContent=msg; a.className='alert '+type;
  setTimeout(()=>a.className='alert hid',6000);
}
function handleFiles(files){
  Array.from(files).forEach(f=>{
    var fd=new FormData(); fd.append('file',f);
    fetch(ngUrl('/api/upload'),{method:'POST',body:fd})
      .then(r=>r.json())
      .then(d=>sa('✓ '+f.name+' — ih:'+d.infohash+' size:'+fB(d.size_estimate),'ok'))
      .catch(e=>sa('✗ '+f.name+': '+e.message,'er'));
  });
}
function purgeInactive(){
  if(!confirm('Remove torrents with no announce in the last 12 hours?')) return;
  API.del('/api/stats/purge?keep_active=true&inactive_hours=12')
    .then(d=>{sa('Purged: '+JSON.stringify(d),'ok'); setTimeout(load,600);})
    .catch(e=>sa('Error: '+e.message,'er'));
}
function purge(){
  if(!confirm('Remove all stopped/finished torrents from stats?')) return;
  API.del('/api/stats/purge')
    .then(d=>{sa('Purged: '+JSON.stringify(d),'ok'); setTimeout(load,600);})
    .catch(e=>sa('Error: '+e.message,'er'));
}
function trkCell(d){
  var t=d.trackers||{};
  var names=Object.keys(t);
  if(!names.length) return '—';
  var tip=names.map(function(n){
    var v=t[n]||{};
    var r=(v.dl>0)?(v.ul/v.dl).toFixed(2):'—';
    return n+'  UL '+fB(v.ul)+'  R '+r;
  }).join('\n');
  return '<span title="'+tip.replace(/"/g,'&quot;')+'">'+names.length+'</span>';
}
function load(){
  Promise.all([API.get('/api/stats'),API.get('/api/config')])
  .then(([s,c])=>{
    _data=s;
    _tgt=parseFloat((c.spoofing&&c.spoofing.target_ratio)||1.6)||1.6;
    document.getElementById('ts').textContent='Updated '+new Date().toLocaleTimeString();
    render();
  })
  .catch(e=>{
    document.getElementById('tbody').innerHTML='<tr><td colspan="13" style="text-align:center;padding:20px;color:var(--er)">API error: '+e.message+'</td></tr>';
  });
}
load(); setInterval(load,15000);

initUI('torrents');
</script>
</body>
</html>
